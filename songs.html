<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4c1d95" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Chordy · Canciones</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="logo-192px.png" type="image/png" />
    <link rel="apple-touch-icon" href="logo-192px.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("chordy_theme");
          document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body data-page="songs">
    <header class="app-header">
      <div class="app-header__brand">
        <div class="app-header__logo">
          <img src="logo.png" alt="" class="app-header__logo-img" width="40" height="40" decoding="async" />
        </div>
        <div>
          <div class="app-header__title">Chordy</div>
          <div class="app-header__subtitle">Biblioteca de canciones</div>
        </div>
      </div>
      <div class="app-header__actions">
        <span
          class="connection-status is-online"
          role="status"
          aria-live="polite"
          aria-label="Con conexión"
          title="Con conexión"
        >
          <i class="bi bi-wifi theme-toggle__icon" aria-hidden="true"></i>
        </span>
        <button type="button" id="notifications-toggle-btn" class="notifications-toggle" aria-label="Notificaciones" aria-pressed="false">
          <i class="bi bi-bell notifications-toggle__icon" aria-hidden="true"></i>
        </button>
        <button type="button" id="theme-toggle-btn" class="theme-toggle" aria-label="Cambiar tema" aria-pressed="false">
          <i class="bi bi-sun theme-toggle__icon" aria-hidden="true"></i>
        </button>
        <button type="button" id="pwa-install-btn" class="pwa-install-btn" hidden>Instalar</button>
      </div>
    </header>

    <main class="app-main" id="main">
      <h1 class="sr-only">Canciones</h1>
      <div class="library-tools">
        <button type="button" id="library-share-btn" class="library-tools__btn">
          <i class="bi bi-share" aria-hidden="true"></i>
          Compartir biblioteca
        </button>
        <button type="button" id="library-import-btn" class="library-tools__btn">
          <i class="bi bi-download" aria-hidden="true"></i>
          Importar lista
        </button>
        <p id="library-tools-status" class="library-tools__status" hidden></p>
      </div>
      <div class="sort-control">
        <div class="sort-dropdown" id="song-sort">
          <button
            type="button"
            class="sort-dropdown__trigger"
            id="song-sort-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="song-sort-list"
          >
            <span class="sort-dropdown__label" id="song-sort-label">A · Z</span>
            <i class="bi bi-chevron-down sort-dropdown__chevron" aria-hidden="true"></i>
          </button>
          <ul class="sort-dropdown__menu" id="song-sort-list" role="listbox" aria-label="Vista de canciones" hidden>
            <li role="option" class="sort-dropdown__option is-selected" data-value="az" aria-selected="true" tabindex="-1">
              A · Z
            </li>
            <li role="option" class="sort-dropdown__option" data-value="za" aria-selected="false" tabindex="-1">
              Z · A
            </li>
            <li role="option" class="sort-dropdown__option" data-value="artist-az" aria-selected="false" tabindex="-1">
              Por artista (A-Z)
            </li>
            <li role="option" class="sort-dropdown__option" data-value="artist-za" aria-selected="false" tabindex="-1">
              Por artista (Z-A)
            </li>
          </ul>
        </div>
      </div>
      <div id="list-songs"></div>
    </main>

    <div id="song-delete-modal-backdrop" class="chord-delete-modal-backdrop" aria-hidden="true"></div>
    <div
      id="song-delete-modal"
      class="chord-delete-modal"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="song-delete-modal-text"
      aria-hidden="true"
    >
      <p id="song-delete-modal-text" class="chord-delete-modal__text"></p>
      <div class="chord-delete-modal__actions">
        <button type="button" id="song-delete-cancel" class="chord-delete-modal__btn chord-delete-modal__btn--ghost">
          Cancelar
        </button>
        <button type="button" id="song-delete-confirm" class="chord-delete-modal__btn chord-delete-modal__btn--danger">
          Eliminar
        </button>
      </div>
    </div>

    <div class="bottom-shell">
      <div id="fab-backdrop" class="fab-backdrop" aria-hidden="true"></div>
      <nav class="bottom-nav" aria-label="Secciones">
        <a class="bottom-nav__link" href="songs.html" data-nav="songs">
          <i class="bi bi-music-note-list" aria-hidden="true"></i>
          Canciones
        </a>
        <div class="bottom-nav__fab">
          <div id="fab-panel" class="fab-panel" role="menu" aria-label="Acciones rápidas">
            <button type="button" class="fab-panel__btn js-fab-open-song-modal" role="menuitem">
              <i class="bi bi-music-note-list" aria-hidden="true"></i>
              Nueva canción
            </button>
            <button type="button" class="fab-panel__btn js-fab-open-chord-modal" role="menuitem">
              <i class="bi bi-file-music" aria-hidden="true"></i>
              Nuevo acorde
            </button>
          </div>
          <button
            type="button"
            id="fab-main"
            class="fab-main"
            aria-label="Abrir acciones"
            aria-expanded="false"
            aria-haspopup="menu"
          >
            <i class="bi bi-plus-lg" aria-hidden="true"></i>
          </button>
        </div>
        <a class="bottom-nav__link" href="chords.html" data-nav="chords">
          <i class="bi bi-file-music" aria-hidden="true"></i>
          Acordes
        </a>
      </nav>
    </div>

    <script src="js/icons.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/fab.js"></script>
    <script src="js/data/data.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/share.js"></script>
    <script src="js/import.js"></script>
    <script src="js/chords.js"></script>
    <script src="js/songs.js"></script>
    <script src="js/pwa.js"></script>
  </body>
</html>
