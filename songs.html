<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4c1d95" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Chordy · Canciones</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="logo-192px.png" type="image/png" />
    <link rel="apple-touch-icon" href="logo-192px.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body data-page="songs">
    <header class="app-header">
      <div class="app-header__brand">
        <div class="app-header__logo">
          <img src="logo.png" alt="" class="app-header__logo-img" width="40" height="40" decoding="async" />
        </div>
        <div>
          <div class="app-header__title">Chordy</div>
          <div class="app-header__subtitle">Biblioteca de canciones</div>
        </div>
      </div>
      <button type="button" id="pwa-install-btn" class="pwa-install-btn" hidden>Instalar</button>
    </header>

    <main class="app-main" id="main">
      <h1 class="sr-only">Canciones</h1>
      <div class="tabs" role="tablist" aria-label="Vista de canciones">
        <button type="button" class="tab is-active" id="tab-az" role="tab" aria-selected="true" aria-controls="panel-az">
          A · Z
        </button>
        <button type="button" class="tab" id="tab-artist" role="tab" aria-selected="false" aria-controls="panel-artist">
          Por artista
        </button>
      </div>
      <div id="panel-az" class="tab-panel" role="tabpanel" aria-labelledby="tab-az">
        <div id="list-az"></div>
      </div>
      <div id="panel-artist" class="tab-panel" role="tabpanel" aria-labelledby="tab-artist" hidden>
        <div id="list-artist"></div>
      </div>
    </main>

    <div class="bottom-shell">
      <div id="fab-backdrop" class="fab-backdrop" aria-hidden="true"></div>
      <nav class="bottom-nav" aria-label="Secciones">
        <a class="bottom-nav__link" href="songs.html" data-nav="songs">
          <i data-lucide="list-music"></i>
          Canciones
        </a>
        <div class="bottom-nav__fab">
          <div id="fab-panel" class="fab-panel" role="menu" aria-label="Acciones rápidas">
            <button type="button" class="fab-panel__btn js-fab-open-song-modal" role="menuitem">
              <i data-lucide="music-2"></i>
              Nueva canción
            </button>
            <button type="button" class="fab-panel__btn js-fab-open-chord-modal" role="menuitem">
              <i data-lucide="guitar"></i>
              Nuevo acorde
            </button>
          </div>
          <button
            type="button"
            id="fab-main"
            class="fab-main"
            aria-label="Abrir acciones"
            aria-expanded="false"
            aria-haspopup="menu"
          >
            <i data-lucide="plus"></i>
          </button>
        </div>
        <a class="bottom-nav__link" href="chords.html" data-nav="chords">
          <i data-lucide="audio-waveform"></i>
          Acordes
        </a>
      </nav>
    </div>

    <script src="js/vendor/lucide.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/fab.js"></script>
    <script src="js/chords-storage.js"></script>
    <script src="js/chord-diagram.js"></script>
    <script src="js/chord-modal.js"></script>
    <script src="js/songs-storage.js"></script>
    <script src="js/song-modal.js"></script>
    <script src="js/songs.js"></script>
    <script src="js/pwa-install.js"></script>
    <script src="js/pwa-register.js"></script>
  </body>
</html>
