<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4c1d95" />
    <title>Chordy · Inicio</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body data-page="home">
    <header class="app-header">
      <div class="app-header__logo" aria-hidden="true">
        <i data-lucide="guitar"></i>
      </div>
      <div>
        <div class="app-header__title">Chordy</div>
        <div class="app-header__subtitle">Acordes de guitarra</div>
      </div>
    </header>

    <main class="app-main" id="main">
      <h1 class="sr-only">Inicio</h1>
      <p class="section-title">Top más descargadas</p>
      <div id="top-downloads"></div>
    </main>

    <div class="bottom-shell">
      <div id="fab-backdrop" class="fab-backdrop" aria-hidden="true"></div>
      <nav class="bottom-nav" aria-label="Secciones">
        <a class="bottom-nav__link" href="index.html" data-nav="home">
          <i data-lucide="home"></i>
          Inicio
        </a>
        <a class="bottom-nav__link" href="songs.html" data-nav="songs">
          <i data-lucide="list-music"></i>
          Canciones
        </a>
        <div class="bottom-nav__fab">
          <div id="fab-panel" class="fab-panel" role="menu" aria-label="Acciones rápidas">
            <button type="button" class="fab-panel__btn" role="menuitem">
              <i data-lucide="music-2"></i>
              Nueva canción
            </button>
            <button type="button" class="fab-panel__btn js-fab-open-chord-modal" role="menuitem">
              <i data-lucide="guitar"></i>
              Nuevo acorde
            </button>
          </div>
          <button
            type="button"
            id="fab-main"
            class="fab-main"
            aria-label="Abrir acciones"
            aria-expanded="false"
            aria-haspopup="menu"
          >
            <i data-lucide="plus"></i>
          </button>
        </div>
        <a class="bottom-nav__link" href="chords.html" data-nav="chords">
          <i data-lucide="audio-waveform"></i>
          Acordes
        </a>
        <a class="bottom-nav__link" href="settings.html" data-nav="settings">
          <i data-lucide="settings"></i>
          Ajustes
        </a>
      </nav>
    </div>

    <script src="https://unpkg.com/lucide@0.487.0/dist/umd/lucide.min.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/fab.js"></script>
    <script src="js/chords-storage.js"></script>
    <script src="js/chord-diagram.js"></script>
    <script src="js/chord-modal.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
