<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4c1d95" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Chordy · Acordes</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="logo-192px.png" type="image/png" />
    <link rel="apple-touch-icon" href="logo-192px.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("chordy_theme");
          document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body data-page="chords">
    <header class="app-header">
      <div class="app-header__brand">
        <div class="app-header__logo">
          <img src="logo.png" alt="" class="app-header__logo-img" width="40" height="40" decoding="async" />
        </div>
        <div>
          <div class="app-header__title">Chordy</div>
          <div class="app-header__subtitle">Catálogo de acordes</div>
        </div>
      </div>
      <div class="app-header__actions">
        <span
          class="connection-status is-online"
          role="status"
          aria-live="polite"
          aria-label="Con conexión"
          title="Con conexión"
        >
          <i class="bi bi-wifi theme-toggle__icon" aria-hidden="true"></i>
        </span>
        <button type="button" id="notifications-toggle-btn" class="notifications-toggle" aria-label="Notificaciones" aria-pressed="false">
          <i class="bi bi-bell notifications-toggle__icon" aria-hidden="true"></i>
        </button>
        <button type="button" id="theme-toggle-btn" class="theme-toggle" aria-label="Cambiar tema" aria-pressed="false">
          <i class="bi bi-sun theme-toggle__icon" aria-hidden="true"></i>
        </button>
        <button type="button" id="pwa-install-btn" class="pwa-install-btn" hidden>Instalar</button>
      </div>
    </header>

    <main class="app-main" id="main">
      <h1 class="sr-only">Acordes</h1>
      <p class="section-title">Todos los acordes</p>
      <div class="chord-search-dock">
        <label for="chord-search" class="sr-only">Buscar acorde</label>
        <input
          type="search"
          id="chord-search"
          class="chord-search-dock__input"
          placeholder="Buscar acorde…"
          autocomplete="off"
          enterkeyhint="search"
        />
      </div>
      <div id="chord-list" class="chord-list"></div>
    </main>

    <div id="chord-delete-modal-backdrop" class="chord-delete-modal-backdrop" aria-hidden="true"></div>
    <div
      id="chord-delete-modal"
      class="chord-delete-modal"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="chord-delete-modal-text"
      aria-hidden="true"
    >
      <p id="chord-delete-modal-text" class="chord-delete-modal__text"></p>
      <div class="chord-delete-modal__actions">
        <button type="button" id="chord-delete-cancel" class="chord-delete-modal__btn chord-delete-modal__btn--ghost">
          Cancelar
        </button>
        <button type="button" id="chord-delete-confirm" class="chord-delete-modal__btn chord-delete-modal__btn--danger">
          Eliminar
        </button>
      </div>
    </div>

    <div class="bottom-shell">
      <div id="fab-backdrop" class="fab-backdrop" aria-hidden="true"></div>
      <nav class="bottom-nav" aria-label="Secciones">
        <a class="bottom-nav__link" href="songs.html" data-nav="songs">
          <i class="bi bi-music-note-list" aria-hidden="true"></i>
          Canciones
        </a>
        <div class="bottom-nav__fab">
          <div id="fab-panel" class="fab-panel" role="menu" aria-label="Acciones rápidas">
            <button type="button" class="fab-panel__btn js-fab-open-song-modal" role="menuitem">
              <i class="bi bi-music-note-list" aria-hidden="true"></i>
              Nueva canción
            </button>
            <button type="button" class="fab-panel__btn js-fab-open-chord-modal" role="menuitem">
              <i class="bi bi-file-music" aria-hidden="true"></i>
              Nuevo acorde
            </button>
          </div>
          <button
            type="button"
            id="fab-main"
            class="fab-main"
            aria-label="Abrir acciones"
            aria-expanded="false"
            aria-haspopup="menu"
          >
            <i class="bi bi-plus-lg" aria-hidden="true"></i>
          </button>
        </div>
        <a class="bottom-nav__link" href="chords.html" data-nav="chords">
          <i class="bi bi-file-music" aria-hidden="true"></i>
          Acordes
        </a>
      </nav>
    </div>

    <script src="js/icons.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/fab.js"></script>
    <script src="js/data/data.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/chords.js"></script>
    <script src="js/pwa.js"></script>
  </body>
</html>
